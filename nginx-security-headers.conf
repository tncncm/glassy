# Security headers, included into EVERY location block.
#
# nginx's `add_header` does not inherit into a location that declares its own
# `add_header` — it replaces the whole set. Since every location here sets
# Cache-Control, the headers below must be re-included in each one or they
# silently vanish on exactly the paths that matter. Hence this file.
#
# PRIVACY: `connect-src 'self'` is the load-bearing line. MediaPipe's vision
# bundle has telemetry compiled in that POSTs usage stats to
# odml.pa.googleapis.com, with no public option to turn it off. The app also
# neutralises it in JS, but a CSP cannot be monkey-patched away by a future
# dependency bump, so this is the real guarantee that camera-derived work never
# leaves the device. Glassy has no backend, so 'self' is all it ever needs.
#
# `wasm-unsafe-eval` is required to instantiate the MediaPipe wasm runtime.
# `mediastream:` in media-src is required for the live camera <video>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "geolocation=(), microphone=(), interest-cohort=()" always;
