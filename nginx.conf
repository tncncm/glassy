server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed, content-addressed assets: long-lived immutable caching.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker and its runtime chunk: must always be revalidated,
    # or installed PWAs get stuck on a stale app shell.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App manifest: no-cache so updates (icons, theme, name) are picked up promptly.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App shell: no-cache so a new deploy is visible on next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise fall back to the
    # app shell (SPA-ish routing) — but the blocks above already intercepted
    # sw.js, manifest.webmanifest and /assets/*, so they never fall through here.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
