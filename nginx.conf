server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Every location below re-includes nginx-security-headers.conf. That is not
    # redundancy: nginx's add_header does NOT inherit into a location that sets
    # its own add_header, and all of them set Cache-Control. See that file.

    # Hashed, content-addressed assets: long-lived immutable caching.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # MediaPipe wasm runtime + detector model. Large, immutable, and only ever
    # fetched by users who opted into detection — cache hard so the
    # multi-megabyte download happens exactly once per device.
    location /vision/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Demo clip. Must 404 when absent rather than falling through to the SPA
    # rewrite below — otherwise a missing file hands the <video> element an
    # HTML document, which fails with a confusing decode error instead of an
    # honest "not found".
    location /demo/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Service worker and its runtime chunk: must always be revalidated,
    # or installed PWAs get stuck on a stale app shell.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App manifest: no-cache so updates (icons, theme, name) are picked up promptly.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App shell: no-cache so a new deploy is visible on next load.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise fall back to the
    # app shell (SPA-ish routing) — but the blocks above already intercepted
    # sw.js, manifest.webmanifest, /assets/* and /vision/*, so they never fall
    # through here.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
