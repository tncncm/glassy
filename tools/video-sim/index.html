<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glassy — video simulation harness</title>
    <style>
      body { margin: 0; background: #05060a; color: #f4f6fb; font: 13px -apple-system, sans-serif; }
      #wrap { position: relative; display: inline-block; }
      video { display: block; max-width: 100vw; }
      canvas { position: absolute; inset: 0; pointer-events: none; }
      #hud { padding: 8px 12px; font-variant-numeric: tabular-nums; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <video id="v" muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="hud">idle</div>

    <script type="module">
      /**
       * Dev-only diagnostic. Runs the REAL SceneAnalyser and ObjectDetector
       * against a recorded video instead of a live camera, so we can judge
       * on real driving footage whether either is worth keeping.
       *
       * The video never leaves this machine: it is read from the local dev
       * server and analysed in-page, exactly as a camera frame would be.
       */
      import { createSceneAnalyser } from '/src/vision/SceneAnalyser.ts';
      import { createObjectDetector } from '/src/vision/ObjectDetector.ts';
      import { corridorHalfWidthAt } from '/src/vision/CarriagewayFilter.ts';

      const video = document.getElementById('v');
      const overlay = document.getElementById('overlay');
      const hud = document.getElementById('hud');
      const ctx = overlay.getContext('2d');

      /** Everything observed, drained by the Node runner at the end. */
      const log = { horizon: [], detections: [], tracked: [], detectorStates: [], errors: [], carriageway: [],
                    flow: null, flowRegions: [], flowCost: [], ego: [], labels: [], inferenceCost: [] };
      let tracked = [];
      window.__simLog = log;
      window.__simDone = false;

      const COLORS = { vehicle: '#ff5d5d', person: '#ff5dfa', sign: '#5be8ff' };
      let latest = [];

      // Carriageway filter diagnostics — the KEPT list is what `tracked`
      // already is (ObjectDetector filters before calling onTrackedObjects);
      // these two are what got dropped, and why, and the exact horizon row
      // the filter used, so the corridor drawn below matches production
      // logic exactly rather than approximating it from the harness's own
      // separate SceneAnalyser instance.
      let rejected = [];
      let rejectedReasons = [];
      let carriagewayHorizonY = null;

      // Ego-motion gate diagnostics (OpticalFlow, via ObjectDetector's own
      // debug hook — see onEgoMotionDebug below).
      let latestEgo = { magnitude: 0, confidence: 0 };
      let latestMoving = false;

      // Motion-mask diagnostics (FlowSupport via SurfaceProfileFinder).
      // `?mask=1` paints the per-cell classification over the video so the
      // question "does flow actually separate the vehicle from the sky?"
      // gets looked at rather than argued about. The tightened region is
      // always drawn — it is what the surface scan was actually pointed at.
      const SHOW_MASK = new URLSearchParams(location.search).get('mask') === '1';
      let flowCells = null;      // Uint8Array copy
      let flowGrid = null;       // { cols, rows, size, canvasWidth, canvasHeight }
      let flowRegions = [];      // { id, decided, left, top, right, bottom }
      let flowTotals = null;
      const REASON_COLORS = {
        corridor: '#ff9d3d',
        size: '#c86bff',
        'near-horizon': '#ff4d4d',
        motion: '#ffe234',
      };

      function draw() {
        // While frozen the overlay is left exactly as it was last painted and
        // the runner seeks the video to an exact time underneath it. That is
        // what makes a before/after pair comparable: both runs show the SAME
        // video frame, each with the annotation its own build computed on the
        // tick just before it. Resizing/clearing here would wipe it.
        if (window.__simFreeze) { requestAnimationFrame(draw); return; }
        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;
        ctx.clearRect(0, 0, overlay.width, overlay.height);

        // Horizon estimate.
        const h = analyser.horizon;
        if (h.y !== null) {
          ctx.strokeStyle = `rgba(125,255,150,${0.25 + 0.75 * h.confidence})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, h.y * overlay.height);
          ctx.lineTo(overlay.width, h.y * overlay.height);
          ctx.stroke();
          ctx.fillStyle = 'rgba(125,255,150,0.95)';
          ctx.font = '12px monospace';
          ctx.fillText(`horizon ${h.y.toFixed(2)} conf ${h.confidence.toFixed(2)}`, 6, h.y * overlay.height - 5);
        }

        // The perspective corridor CarriagewayFilter actually filtered
        // against this tick, drawn as the trapezoid it is: narrow at the
        // horizon, wide at the bottom of frame. Uses the EXACT horizon value
        // the filter used (from ObjectDetector's own internal analyser via
        // onCarriagewayDebug), not the harness's separate one, so this is
        // never an approximation of what ran.
        if (carriagewayHorizonY !== null) {
          const hy = carriagewayHorizonY;
          const steps = 24;
          ctx.strokeStyle = 'rgba(80,180,255,0.55)';
          ctx.fillStyle = 'rgba(80,180,255,0.06)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const y = hy + (1 - hy) * (i / steps);
            const hw = corridorHalfWidthAt(y, hy);
            const x = (0.5 - hw) * overlay.width;
            if (i === 0) ctx.moveTo(x, y * overlay.height); else ctx.lineTo(x, y * overlay.height);
          }
          for (let i = steps; i >= 0; i--) {
            const y = hy + (1 - hy) * (i / steps);
            const hw = corridorHalfWidthAt(y, hy);
            const x = (0.5 + hw) * overlay.width;
            ctx.lineTo(x, y * overlay.height);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // The motion mask, cell by cell. Green = "moves with us" (vehicle),
        // red = "moves with the world" (sky edge, treeline, wire, road),
        // nothing drawn = no texture to judge by. Only under ?mask=1 — it
        // covers the picture, which is exactly what you want when checking
        // the mask and exactly what you don't when checking the surface.
        if (SHOW_MASK && flowCells && flowGrid) {
          const cw = (flowGrid.size / flowGrid.canvasWidth) * overlay.width;
          const ch = (flowGrid.size / flowGrid.canvasHeight) * overlay.height;
          for (let r = 0; r < flowGrid.rows; r++) {
            for (let c = 0; c < flowGrid.cols; c++) {
              const v = flowCells[r * flowGrid.cols + c];
              if (v === 0 || v === 1) continue; // unevaluated / unknown
              ctx.fillStyle = v === 2 ? 'rgba(60,255,120,0.42)' : 'rgba(255,60,60,0.30)';
              ctx.fillRect(c * cw, r * ch, cw - 1, ch - 1);
            }
          }
        }

        // The region the surface scan was actually pointed at. Solid cyan
        // when the mask decided it, so a tightened box is instantly
        // distinguishable from an untouched one on a still frame.
        for (const reg of flowRegions) {
          if (!reg.decided) continue;
          ctx.strokeStyle = 'rgba(0,229,255,0.9)';
          ctx.lineWidth = 2;
          ctx.setLineDash([2, 2]);
          ctx.strokeRect(
            reg.left * overlay.width,
            reg.top * overlay.height,
            (reg.right - reg.left) * overlay.width,
            (reg.bottom - reg.top) * overlay.height,
          );
          ctx.setLineDash([]);
        }

        // Rejected objects — dropped by CarriagewayFilter this tick. Thick
        // red-family dashed box, coloured by WHY, with the reason labelled
        // so a frame grab tells you not just "gone" but "gone, and here's
        // the signal that did it".
        for (let i = 0; i < rejected.length; i++) {
          const o = rejected[i];
          const reason = rejectedReasons[i] ?? '?';
          const x = (o.x - o.width / 2) * overlay.width;
          const y = (o.y - o.height / 2) * overlay.height;
          const w = o.width * overlay.width;
          const hh = o.height * overlay.height;
          ctx.strokeStyle = REASON_COLORS[reason] ?? '#ff2d2d';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(x, y, w, hh);
          ctx.setLineDash([]);
          ctx.fillStyle = REASON_COLORS[reason] ?? '#ff2d2d';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(`✕ ${reason}`, x + 3, y - 4);
        }

        // Tracked objects — the thing platforms are actually built from.
        // Everything drawn here already SURVIVED the carriageway filter.
        for (const o of tracked) {
          const x = (o.x - o.width / 2) * overlay.width;
          const y = (o.y - o.height / 2) * overlay.height;
          const w = o.width * overlay.width;
          const hh = o.height * overlay.height;
          ctx.strokeStyle = o.stable ? '#39ff88' : 'rgba(255,255,255,0.35)';
          ctx.lineWidth = o.stable ? 3 : 1;
          ctx.setLineDash(o.stable ? [] : [4, 4]);
          ctx.strokeRect(x, y, w, hh);
          ctx.setLineDash([]);

          // The REFINED flat surface (SurfaceProfileFinder's single-row
          // result), drawn distinctly from the raw box top: dim yellow,
          // only across surfaceLeft..surfaceRight rather than the box's
          // full width, so a landing surface that is narrower than the box
          // is visibly narrower on screen too. Kept for comparison against
          // the polyline below — this is the flat slab the profile replaces.
          const sx = o.surfaceLeft * overlay.width;
          const sw = (o.surfaceRight - o.surfaceLeft) * overlay.width;
          const sy = o.surfaceY * overlay.height;
          ctx.strokeStyle = o.stable ? 'rgba(255,226,52,0.55)' : 'rgba(255,226,52,0.3)';
          ctx.lineWidth = o.stable ? 1.5 : 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + sw, sy);
          ctx.stroke();
          ctx.setLineDash([]);

          // The actual traced silhouette — surfaceProfile drawn as a
          // polyline across the same surfaceLeft..surfaceRight span. THIS
          // is what should trace the bonnet/windscreen/roof shape instead
          // of sitting flat like the dashed line above.
          if (o.surfaceProfile && o.surfaceProfile.length > 1) {
            const n = o.surfaceProfile.length;
            ctx.strokeStyle = o.stable ? '#ff8a3d' : 'rgba(255,138,61,0.5)';
            ctx.lineWidth = o.stable ? 2.5 : 1.5;
            ctx.beginPath();
            for (let p = 0; p < n; p++) {
              const px = sx + (sw * p) / (n - 1);
              const py = o.surfaceProfile[p] * overlay.height;
              if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            // Small dots at each sample so individual columns are visible
            // at full zoom, not just the smoothed line through them.
            if (o.stable) {
              ctx.fillStyle = '#ff8a3d';
              for (let p = 0; p < n; p++) {
                const px = sx + (sw * p) / (n - 1);
                const py = o.surfaceProfile[p] * overlay.height;
                ctx.fillRect(px - 1, py - 1, 2, 2);
              }
            }
          }

          if (o.stable) {
            ctx.fillStyle = '#39ff88';
            ctx.fillRect(x, y - 3, w, 4);       // the raw box top, for comparison
            ctx.font = 'bold 12px monospace';
            ctx.fillText(`#${o.id} ${o.kind}`, x + 3, y - 8);
          }
        }

        // Raw detections.
        for (const d of latest) {
          const x = (d.x - d.width / 2) * overlay.width;
          const y = (d.y - d.height / 2) * overlay.height;
          const w = d.width * overlay.width;
          const hh = d.height * overlay.height;
          ctx.strokeStyle = COLORS[d.kind] ?? '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, hh);
          ctx.fillStyle = COLORS[d.kind] ?? '#fff';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(`${d.kind} ${d.score.toFixed(2)}`, x + 3, y - 4);
        }

        hud.textContent =
          `t=${video.currentTime.toFixed(1)}s / ${(video.duration || 0).toFixed(1)}s   ` +
          `horizon=${h.y === null ? 'null' : h.y.toFixed(3)} conf=${h.confidence.toFixed(2)}   ` +
          `detections=${latest.length}   detector=${detector.state.status}   ` +
          `carriageway: kept=${tracked.length} rejected=${rejected.length}   ` +
          `ego: mag=${latestEgo.magnitude.toFixed(4)} conf=${latestEgo.confidence.toFixed(2)} moving=${latestMoving}   ` +
          (flowTotals ? `mask: ${flowTotals.boxesDecided}/${flowTotals.boxesSeen} decided, ${flowTotals.lastCostMs.toFixed(2)}ms` : 'mask: -');

        if (!window.__simDone) requestAnimationFrame(draw);
      }

      // `?model=lite2int8|lite2float16` swaps the model ObjectDetector fetches
      // at start() — diagnostic-only (`modelPath`, see ObjectDetector.ts's
      // ObjectDetectorDebugOptions), so an A/B against Lite0 is the same
      // build, not a git checkout apart. Defaults to whatever ObjectDetector
      // itself ships (Lite0 float16).
      const MODEL_OVERRIDES = {
        lite2int8: '/vision/efficientdet_lite2_int8.tflite',
        lite2float16: '/vision/efficientdet_lite2_float16.tflite',
      };
      const modelParam = new URLSearchParams(location.search).get('model');
      const modelPath = modelParam ? MODEL_OVERRIDES[modelParam] : undefined;
      if (modelParam && !modelPath) console.warn(`unknown ?model= value: ${modelParam}`);

      const analyser = createSceneAnalyser({ video, sampleHz: 6 });
      const detector = createObjectDetector({
        video,
        modelPath,
        sampleHz: 4,
        onStateChange: (s) => log.detectorStates.push({ t: video.currentTime, ...s }),
        onTrackedObjects: (objs) => {
          // `{ ...o }` only shallow-copies own properties — a Float32Array
          // field would still be the SAME pooled array the caller keeps
          // mutating next tick. Draw happens later (next rAF), so without an
          // explicit copy the polyline would race the pool and occasionally
          // paint a half-updated frame's data. Copy it out explicitly.
          tracked = objs.map((o) => ({ ...o, surfaceProfile: Float32Array.from(o.surfaceProfile) }));
          for (const o of tracked) {
            log.tracked.push({ t: +video.currentTime.toFixed(2), id: o.id, kind: o.kind,
              x: +o.x.toFixed(3), y: +o.y.toFixed(3), w: +o.width.toFixed(3),
              h: +o.height.toFixed(3), stable: o.stable,
              surfaceY: +o.surfaceY.toFixed(3), surfaceLeft: +o.surfaceLeft.toFixed(3),
              surfaceRight: +o.surfaceRight.toFixed(3),
              profile: Array.from(o.surfaceProfile).map((v) => +v.toFixed(4)) });
          }
        },
        // Diagnostic-only hook ObjectDetector reads via a local structural
        // type, not part of the frozen ObjectDetectorOptions contract (see
        // ObjectDetector.ts) — exists purely so this harness can see what
        // the carriageway filter dropped and why.
        // Diagnostic-only, same escape hatch as onCarriagewayDebug: the
        // arrays handed over are reused by the finder, so copy anything the
        // next rAF will still want to draw.
        onSurfaceFlowDebug: (d) => {
          flowGrid = { cols: d.cellCols, rows: d.cellRows, size: d.cellSize,
                       canvasWidth: d.canvasWidth, canvasHeight: d.canvasHeight };
          flowCells = Uint8Array.from(d.cells);
          flowRegions = [];
          for (let i = 0; i < d.regionCount; i++) {
            const o = i * 6;
            flowRegions.push({ id: d.regions[o], decided: d.regions[o + 1] === 1,
              left: d.regions[o + 2], top: d.regions[o + 3],
              right: d.regions[o + 4], bottom: d.regions[o + 5] });
          }
          flowTotals = { ticks: d.ticks, boxesSeen: d.boxesSeen, boxesDecided: d.boxesDecided,
            boxesTightened: d.boxesTightened, costMsTotal: d.costMsTotal, lastCostMs: d.lastCostMs };
          log.flow = flowTotals;
          for (const reg of flowRegions) {
            log.flowRegions.push({ t: +video.currentTime.toFixed(2), id: reg.id, decided: reg.decided,
              left: +reg.left.toFixed(4), top: +reg.top.toFixed(4),
              right: +reg.right.toFixed(4), bottom: +reg.bottom.toFixed(4) });
          }
          log.flowCost.push(+d.lastCostMs.toFixed(3));
        },
        // Diagnostic A/B switch: `?nomask=1` runs SurfaceProfileFinder's
        // pre-mask algorithm, so "before" and "after" are the same build.
        disableFlowMask: new URLSearchParams(location.search).get('nomask') === '1',
        onCarriagewayDebug: (kept, rej, reasons, horizonY) => {
          rejected = rej.map((o) => ({ ...o }));
          rejectedReasons = reasons.slice();
          carriagewayHorizonY = horizonY;
          for (let i = 0; i < rejected.length; i++) {
            log.carriageway.push({ t: +video.currentTime.toFixed(2), id: rejected[i].id,
              kind: rejected[i].kind, x: +rejected[i].x.toFixed(3), y: +rejected[i].y.toFixed(3),
              w: +rejected[i].width.toFixed(3), h: +rejected[i].height.toFixed(3),
              stable: rejected[i].stable, reason: rejectedReasons[i], horizonY,
              kept: false });
          }
          for (const o of kept) {
            if (o.kind !== 'vehicle') continue;
            log.carriageway.push({ t: +video.currentTime.toFixed(2), id: o.id, kind: o.kind,
              x: +o.x.toFixed(3), y: +o.y.toFixed(3), w: +o.width.toFixed(3), h: +o.height.toFixed(3),
              stable: o.stable, reason: null, horizonY, kept: true });
          }
        },
        // Diagnostic-only, same escape hatch as onCarriagewayDebug/
        // onSurfaceFlowDebug: the array handed over is `output`, reused by
        // ObjectDetector every tick, so copy what we keep. This is the ONLY
        // way to get a raw (pre-tracking) detections/sec number and see which
        // labels actually fired, now that `onDetections` no longer exists on
        // the real (frozen) ObjectDetectorOptions.
        onRawDetections: (dets) => {
          latest = dets.map((d) => ({ ...d }));
          for (const d of latest) log.detections.push({ t: +video.currentTime.toFixed(2), ...d });
        },
        // Diagnostic-only: the ego-motion sample CarriagewayFilter's gate is
        // reading this tick, and its resulting moving/not-moving decision —
        // see CarriagewayFilter.ts's "EGO-MOTION GATE" section.
        onEgoMotionDebug: (ego, isMoving, costMs) => {
          latestEgo = { magnitude: ego.magnitude, confidence: ego.confidence };
          latestMoving = isMoving;
          log.ego.push({ t: +video.currentTime.toFixed(2), magnitude: +ego.magnitude.toFixed(5),
            confidence: +ego.confidence.toFixed(3), moving: isMoving, costMs: +costMs.toFixed(3) });
        },
        // Diagnostic-only: the ORIGINAL COCO label, before ObjectDetector
        // collapses it to `kind` — see LABEL_TO_KIND in ObjectDetector.ts.
        onRawLabelsDebug: (raw) => {
          for (const d of raw) {
            log.labels.push({ t: +video.currentTime.toFixed(2), label: d.categoryName, score: +d.score.toFixed(3) });
          }
        },
        // Diagnostic-only: wall-clock cost of one detect round-trip — the
        // number that decides whether a model fits the sample budget.
        onInferenceCostDebug: (ms) => log.inferenceCost.push(+ms.toFixed(2)),
      });

      window.addEventListener('error', (e) => log.errors.push(String(e.message)));

      /**
       * Park the picture on an exact video time without letting the analysis
       * see the seek. `draw()` stops repainting first, so the overlay keeps
       * the annotation computed from real playback; then the video is paused
       * and seeked, which would otherwise hand the motion mask a discontinuity
       * (and a paused frame, where nothing moves and everything reads as
       * "with us"). `__simResume` puts it back.
       */
      window.__simFreezeAt = async (t) => {
        window.__simFreeze = true;
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        video.pause();
        await new Promise((res) => {
          const done = () => { video.removeEventListener('seeked', done); res(); };
          video.addEventListener('seeked', done);
          video.currentTime = t;
        });
        return +video.currentTime.toFixed(3);
      };
      window.__simResume = async () => {
        window.__simFreeze = false;
        await video.play();
      };

      window.__simStart = async (src, playbackRate) => {
        video.src = src;
        await new Promise((res, rej) => {
          video.onloadeddata = res;
          video.onerror = () => rej(new Error('video failed to load'));
        });
        video.playbackRate = playbackRate ?? 1;
        log.meta = {
          width: video.videoWidth,
          height: video.videoHeight,
          duration: video.duration,
        };

        analyser.start();
        await detector.start();

        // Sample the horizon on our own clock so the log has an even series.
        const horizonTimer = setInterval(() => {
          const h = analyser.horizon;
          log.horizon.push({ t: +video.currentTime.toFixed(2), y: h.y, confidence: h.confidence });
        }, 200);

        video.onended = () => {
          clearInterval(horizonTimer);
          analyser.stop();
          detector.stop();
          window.__simDone = true;
        };

        await video.play();
        draw();
        return log.meta;
      };
    </script>
  </body>
</html>
