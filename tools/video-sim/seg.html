<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glassy — instance segmentation prototype harness</title>
    <style>
      body { margin: 0; background: #05060a; color: #f4f6fb; font: 13px -apple-system, sans-serif; }
      #wrap { position: relative; display: inline-block; }
      video, img { display: block; max-width: 100vw; }
      canvas.overlay { position: absolute; inset: 0; pointer-events: none; }
      #hud { padding: 8px 12px; font-variant-numeric: tabular-nums; white-space: pre-wrap; max-width: 900px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <video id="v" muted playsinline style="display:none"></video>
      <img id="im" style="display:none" />
      <canvas id="overlay" class="overlay"></canvas>
    </div>
    <div id="hud">idle</div>

    <script type="module">
      /**
       * PROTOTYPE-ONLY harness for src/vision/experimental/InstanceSegmenter.ts
       * — evaluates ONNX-Runtime-Web instance segmentation against real
       * driving footage (video mode) and offline test photos (image mode,
       * desk/beach — never real Glassy camera footage; see the report for
       * exactly what is real vs. synthetic). Never touched by the shipped
       * app; not part of tools/video-sim's production A/B harness
       * (index.html).
       */
      import { createInstanceSegmenter } from '/src/vision/experimental/InstanceSegmenter.ts';

      const params = new URLSearchParams(location.search);
      const mode = params.get('mode') ?? 'video'; // 'video' | 'image'
      const inputSize = Number(params.get('inputSize') ?? '320');
      const modelPath = params.get('model') ?? '/tools/video-sim/models/yolov8n-seg-320.onnx';
      const scoreThreshold = Number(params.get('score') ?? '0.25');

      const video = document.getElementById('v');
      const img = document.getElementById('im');
      const overlay = document.getElementById('overlay');
      const hud = document.getElementById('hud');
      const ctx = overlay.getContext('2d');
      const activeEl = mode === 'image' ? img : video;
      if (mode === 'image') img.style.display = 'block'; else video.style.display = 'block';

      const log = { events: [], costs: [], instancesByLabel: {}, errors: [] };
      window.__segLog = log;

      window.addEventListener('error', (e) => log.errors.push(String(e.message)));

      const PALETTE = ['#ff5d5d', '#5be8ff', '#ffe234', '#39ff88', '#ff5dfa', '#ff8a3d', '#8a7dff', '#7dffb0'];
      function colorFor(label) {
        let h = 0;
        for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
        return PALETTE[h % PALETTE.length];
      }
      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function drawResult(result) {
        const w = activeEl.clientWidth || activeEl.videoWidth || activeEl.naturalWidth;
        const h = activeEl.clientHeight || activeEl.videoHeight || activeEl.naturalHeight;
        overlay.width = w;
        overlay.height = h;
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        if (!result) return;

        for (const inst of result.instances) {
          const x = (inst.x - inst.width / 2) * overlay.width;
          const y = (inst.y - inst.height / 2) * overlay.height;
          const iw = inst.width * overlay.width;
          const ih = inst.height * overlay.height;
          const color = colorFor(inst.label);

          // Mask: paint the low-res soft mask into a tiny offscreen canvas,
          // then let the browser's own image smoothing upscale it onto the
          // box's screen-space rect — cheap, and close to what a real
          // render-time bilinear sample would look like.
          if (inst.maskWidth > 0 && inst.maskHeight > 0) {
            const maskCanvas = new OffscreenCanvas(inst.maskWidth, inst.maskHeight);
            const mctx = maskCanvas.getContext('2d');
            const imageData = mctx.createImageData(inst.maskWidth, inst.maskHeight);
            const rgb = hexToRgb(color);
            for (let i = 0; i < inst.mask.length; i++) {
              const v = Math.max(0, Math.min(1, inst.mask[i]));
              const o = i * 4;
              imageData.data[o] = rgb.r;
              imageData.data[o + 1] = rgb.g;
              imageData.data[o + 2] = rgb.b;
              imageData.data[o + 3] = v * 170; // capped translucency — judge shape, not fight the frame
            }
            mctx.putImageData(imageData, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(maskCanvas, x, y, iw, ih);
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, iw, ih);
          ctx.fillStyle = color;
          ctx.font = 'bold 12px monospace';
          ctx.fillText(`${inst.label} ${inst.score.toFixed(2)}`, x + 3, y - 4);
        }

        hud.textContent =
          `mode=${mode} inputSize=${inputSize} model=${modelPath.split('/').pop()}\n` +
          `instances=${result.instances.length}  ` +
          `pre=${result.preprocessMs.toFixed(1)}ms  inf=${result.inferenceMs.toFixed(1)}ms  post=${result.postprocessMs.toFixed(1)}ms  ` +
          `total=${(result.preprocessMs + result.inferenceMs + result.postprocessMs).toFixed(1)}ms\n` +
          result.instances
            .map((i) => `  ${i.label.padEnd(14)} score=${i.score.toFixed(2)} box=[${i.x.toFixed(2)},${i.y.toFixed(2)},${i.width.toFixed(2)},${i.height.toFixed(2)}] mask=${i.maskWidth}x${i.maskHeight}`)
            .join('\n');
      }

      const segmenter = createInstanceSegmenter({
        video: activeEl,
        inputSize,
        modelPath,
        scoreThreshold,
        onStateChange: (s) => log.events.push({ t: performance.now(), state: s }),
      });

      window.__segStart = async () => {
        await segmenter.start();
      };

      window.__segLoadVideo = async (src, playbackRate) => {
        video.src = src;
        await new Promise((res, rej) => {
          video.onloadeddata = res;
          video.onerror = () => rej(new Error('video failed to load'));
        });
        video.playbackRate = playbackRate ?? 1;
        await video.play();
        return { width: video.videoWidth, height: video.videoHeight, duration: video.duration };
      };

      window.__segLoadImage = async (src) => {
        img.src = src;
        await img.decode();
        return { width: img.naturalWidth, height: img.naturalHeight };
      };

      window.__segDetectOnce = async () => {
        const wallStart = performance.now();
        const result = await segmenter.detect();
        const wall = performance.now() - wallStart;
        if (result) {
          log.costs.push({
            t: mode === 'video' ? +video.currentTime.toFixed(2) : 0,
            wall: +wall.toFixed(2),
            pre: result.preprocessMs,
            inf: result.inferenceMs,
            post: result.postprocessMs,
          });
          for (const inst of result.instances) {
            log.instancesByLabel[inst.label] = (log.instancesByLabel[inst.label] ?? 0) + 1;
          }
        }
        drawResult(result);
        return result ? { n: result.instances.length, inf: result.inferenceMs, wall } : null;
      };
    </script>
  </body>
</html>
